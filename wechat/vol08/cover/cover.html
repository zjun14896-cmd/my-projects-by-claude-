<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<title>Vol.08 封面</title>
<style>
/* 封面源文件：用浏览器按 #wide (1800×766) 与 #square (900×900) 截图导出。字体为思源黑体 / Noto Sans SC（开源可商用）。 */
:root{--dark:#07090F;--blue:#003CAC;--yellow:#FFC833;--muted:#A1A1A8}
body{margin:0;background:#222;font-family:"PingFang SC","Noto Sans SC",sans-serif}
.c{position:relative;overflow:hidden;background:var(--dark);color:#fff}
.c .ph{position:absolute;background:url(../img/00-hero.jpg) center/cover}
.c .glow{position:absolute;inset:0;background:radial-gradient(70% 90% at 0% 100%,rgba(0,60,172,.7),rgba(0,60,172,0) 70%)}
.c .t{position:absolute}
.k{color:var(--yellow);font-weight:600;letter-spacing:.3em}
.h{font-weight:700;line-height:1.18;letter-spacing:-.01em;margin:0}
.s{color:var(--muted);letter-spacing:.06em}
.logo{display:block}
#wide{width:1800px;height:766px}
#wide .ph{right:0;top:0;width:1060px;height:766px;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 38%);mask-image:linear-gradient(90deg,transparent 0,#000 38%)}
#wide .t{left:96px;top:110px}
#wide .logo{width:170px}
#wide .k{font-size:26px;margin-top:88px}
#wide .h{font-size:104px;margin-top:22px}
#wide .s{font-size:30px;margin-top:30px}
#square{width:900px;height:900px;margin-top:40px}
#square .ph{left:0;top:0;width:900px;height:560px;-webkit-mask-image:linear-gradient(180deg,#000 55%,transparent 100%);mask-image:linear-gradient(180deg,#000 55%,transparent 100%)}
#square .t{left:72px;bottom:72px}
#square .shade{position:absolute;left:0;top:0;width:900px;height:240px;background:linear-gradient(180deg,rgba(7,9,15,.75),rgba(7,9,15,0))}
#square .logo{position:absolute;left:72px;top:64px;width:150px}
#square .k{font-size:22px}
#square .h{font-size:84px;margin-top:16px}
</style></head>
<body>
<div class="c" id="wide"><div class="ph"></div><div class="glow"></div>
  <div class="t"><img class="logo" src="../img/logo-white.png" alt="云拓会">
    <div class="k">第 8 期线下实操课 · 回顾</div>
    <p class="h">五天，<br>把路走通。</p>
    <div class="s">2026.10.12 — 10.16 · TikTok 跨境电商</div></div></div>
<div class="c" id="square"><div class="ph"></div><div class="glow"></div><div class="shade"></div>
  <img class="logo" src="../img/logo-white.png" alt="云拓会">
  <div class="t"><div class="k">第 8 期线下实操课</div><p class="h">五天，<br>把路走通。</p></div></div>
</body></html>
